<style id="rk-acilis">html{background:#FBF8F5}html:not(.rk-hazir) body{visibility:hidden}#rk-acilis-ekran{visibility:visible;position:fixed;top:0;left:0;right:0;bottom:0;z-index:2147483000;background:#FBF8F5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#5C554F}html.rk-hazir #rk-acilis-ekran{display:none}#rk-acilis-ekran .rk-ac-yuk{width:40px;height:40px;border-radius:50%;border:4px solid #E7E0D9;border-top-color:#F85300;animation:rk-ac-don .9s linear infinite}@keyframes rk-ac-don{to{transform:rotate(360deg)}}#rk-acilis-ekran .rk-ac-ad{font-weight:800;font-size:22px;letter-spacing:-.01em;color:#14110F}#rk-acilis-ekran .rk-ac-ad span{color:#F85300}#rk-acilis-ekran .rk-ac-yavas{display:none;font-size:15px;line-height:1.5}#rk-acilis-ekran.yavas .rk-ac-yavas{display:block}#rk-acilis-ekran button{margin-top:12px;padding:10px 22px;border:0;border-radius:999px;background:#F85300;color:#fff;font:600 15px system-ui,-apple-system,sans-serif}</style>
